name: studinsight

services:
  frontend:
    container_name: studinsight-frontend
    image: studinsight-frontend
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./src:/app/src:z
      - ./package.json:/app/package.json:ro
    ports:
      - "3000:3000"
    networks:
      - studinsight-network
    environment:
      - API_URL=http://localhost:8080/api
    depends_on:
      - backend
  
  backend:
    container_name: studinsight-backend
    command: "/start"
    build:
      context: ../backend_django
      dockerfile: ./compose/local/django/Dockerfile
    image: studinsight-backend
    ports:
      - "8080:8000"
    networks:
      - studinsight-network
    volumes:
      - ../backend_django:/app
      - /app/.venv
    environment:
      - USE_DOCKER=yes
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DATABASE_URL=postgres://studinsight:${POSTGRES_PASSWORD:-changeme}@postgres:5432/studinsight
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - FRONTEND_URL=http://localhost:3000
      # S3/MinIO storage
      - USE_S3_STORAGE=true
      - DJANGO_AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - DJANGO_AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - DJANGO_AWS_STORAGE_BUCKET_NAME=studinsight-media
      - DJANGO_AWS_S3_ENDPOINT_URL=http://minio:9000
      - DJANGO_AWS_S3_PUBLIC_URL=http://localhost:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/auth/csrf"]
      interval: 30s
      timeout: 10s
      retries: 3
    
  backend-init:
    image: studinsight-backend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studinsight-network
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DATABASE_URL=postgres://studinsight:${POSTGRES_PASSWORD:-changeme}@postgres:5432/studinsight
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py seed_demo
      "

  postgres:
    image: postgres:16-alpine
    container_name: studinsight-postgres
    ports:
      - "5432:5432"
    networks:
      - studinsight-network
    environment:
      - POSTGRES_DB=studinsight
      - POSTGRES_USER=studinsight
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studinsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studinsight-redis
    networks:
      - studinsight-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: studinsight-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - studinsight-network
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_KMS_SECRET_KEY=${MINIO_KMS_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: studinsight-minio-init
    networks:
      - studinsight-network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/studinsight-media --ignore-existing;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: studinsight-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - studinsight-network

networks:
  studinsight-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data: